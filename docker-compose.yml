services:
  git:
    image: codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
    container_name: git_ui
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    restart: always
    depends_on:
      - git_db
    ports:
      - "127.0.0.1:8000:3000"
      - "127.0.0.1:2222:22"
    security_opt:
      - no-new-privileges:true
    environment:
      USER_UID: 1000
      USER_GID: 1000
      DB_TYPE: postgres
      DB_HOST: git_db
      DB_NAME: git
      DB_USER: git
      DB_PASSWD: ${DB_PASSWD}
      APP_NAME: git
      FORGEJO__APP__DEFAULT_LANG: en-US
      FORGEJO__I18N__LANGS: en-US
      FORGEJO__I18N__NAMES: English
      FORGEJO__ACTIONS__ENABLED: "false"
      FORGEJO__SECURITY__DISABLE_GIT_HOOKS: "true"
      FORGEJO__SECURITY__REVERSE_PROXY_TRUSTED_PROXIES: "127.0.0.1/32"
      FORGEJO__SERVICE__DISABLE_REGISTRATION: "true"
      FORGEJO__OPENID__ENABLE_OPENID_SIGNUP: "false"
      FORGEJO__REPOSITORY__DEFAULT_PRIVATE: "private"
    volumes:
      - git_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  git_db:
    image: postgres:18
    container_name: git_db
    mem_limit: 1g
    cpus: "2.0"
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: git
      POSTGRES_PASSWORD: ${DB_PASSWD}
      POSTGRES_DB: git
    volumes:
      - git_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U git"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  git_db_data:
    external: true
    name: git_git_db_data
  git_data:
    external: true
    name: git_git_data
